name: btc-paper-bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "只發送測試通知 (true/false)"
        default: "true"
permissions:
  contents: write
concurrency:
  group: btc-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas matplotlib
      - name: 測試通知
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'true'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python btc_paper_bot.py --test
      - name: 執行機器人
        if: github.event_name == 'schedule' || github.event.inputs.test != 'true'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python btc_paper_bot.py
      - name: 儲存紀錄
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json trades.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update" && git pull --rebase && git push)
